[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-embodied-runtime"
version = "0.1.0"
description = "Multi-rate belief fusion and Laya decisions over Show-Harness atomic actions"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
laya = ["laya>=0.3.4"]
mujoco = ["mujoco>=3.2"]
libero = ["robosuite>=1.4"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["embodied_runtime*"]

[tool.setuptools.package-data]
"embodied_runtime.experiments" = ["tasks/*.bddl", "tasks/*.json"]
